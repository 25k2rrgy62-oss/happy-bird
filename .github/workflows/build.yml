name: Build apps

# One game file (index.html) builds both apps. Every push that changes the game,
# the images or this workflow builds Android and iOS, then puts both files on the
# "latest" release so they can be downloaded directly (no zip).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '*.png', '*.PNG', '.github/workflows/build.yml']

permissions:
  contents: write

env:
  CAP_VERSION: 6.2.0
  HAPTICS_VERSION: 6.0.2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Find the images
        run: |
          [ -f index.html ] || { echo "::error::index.html not found. Upload the game as index.html."; exit 1; }
          for f in *.png *.PNG; do
            [ -f "$f" ] || continue
            w=$(identify -format '%w' "$f")
            if [ "$w" = "1024" ] && [ ! -f icon.png ]; then cp "$f" icon.png; echo "Icon: $f"; fi
            if [ "$w" = "2732" ] && [ ! -f splash.png ]; then cp "$f" splash.png; echo "Launch screen: $f"; fi
          done

      - name: Create the Android project
        run: |
          npm init -y
          npm install @capacitor/core@$CAP_VERSION @capacitor/cli@$CAP_VERSION @capacitor/android@$CAP_VERSION @capacitor/haptics@$HAPTICS_VERSION
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.happybird.game",
            "appName": "Happy Bird",
            "webDir": "www",
            "backgroundColor": "#16222e",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android
          RES=android/app/src/main/res
          # Portrait only, full screen without the status bar
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar"\(.*\)>#<style name="AppTheme.NoActionBar"\1>\n        <item name="android:windowFullscreen">true</item>#' $RES/values/styles.xml
          # App icon
          if [ -f icon.png ]; then
            rm -rf $RES/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir=$RES/mipmap-${d%%:*}; size=${d##*:}
              convert icon.png -filter point -resize ${size}x${size} $dir/ic_launcher.png
              cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            done
          fi
          # Launch screen
          if [ -f splash.png ]; then
            for f in $(find $RES -name 'splash.png'); do
              dims=$(identify -format '%wx%h' "$f")
              convert splash.png -filter point -resize "$dims^" -gravity center -extent "$dims" "$f"
            done
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HappyBird.apk"
          unzip -tq "$GITHUB_WORKSPACE/HappyBird.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HappyBird-apk
          path: HappyBird.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the iOS project
        run: |
          [ -f index.html ] || { echo "::error::index.html not found. Upload the game as index.html."; exit 1; }
          npm init -y
          npm install @capacitor/core@$CAP_VERSION @capacitor/cli@$CAP_VERSION @capacitor/ios@$CAP_VERSION @capacitor/haptics@$HAPTICS_VERSION
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.happybird.game",
            "appName": "Happy Bird",
            "webDir": "www",
            "backgroundColor": "#16222e",
            "ios": { "contentInset": "never", "scrollEnabled": false },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add ios
          npx cap sync ios
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $PLIST || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" $PLIST
          /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $PLIST || /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PLIST

      - name: Add the app icon and launch screen
        run: |
          ASSETS=ios/App/App/Assets.xcassets
          # Find the images by size, whatever they are named
          for f in *.png *.PNG; do
            [ -f "$f" ] || continue
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            if [ "$w" = "1024" ] && [ ! -f icon.png ]; then cp "$f" icon.png; echo "Icon: $f"; fi
            if [ "$w" = "2732" ] && [ ! -f splash.png ]; then cp "$f" splash.png; echo "Launch screen: $f"; fi
          done
          if [ -f icon.png ]; then
            rm -f $ASSETS/AppIcon.appiconset/*.png
            cp icon.png $ASSETS/AppIcon.appiconset/AppIcon-512@2x.png
            cat > $ASSETS/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          fi
          if [ -f splash.png ]; then
            for f in $ASSETS/Splash.imageset/*.png; do cp splash.png "$f"; done
          fi

      - name: Build the app (unsigned)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr HappyBird.ipa Payload
          unzip -tq HappyBird.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HappyBird-ipa
          path: HappyBird.ipa

  # Puts whichever apps built on the "latest" release as plain downloads
  release:
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HappyBird-*
          merge-multiple: true

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          files=$(ls HappyBird.apk HappyBird.ipa 2>/dev/null)
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest $files --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Happy Bird (latest build)" \
            --notes "Android: download HappyBird.apk on your phone and open it to install.
          iPhone: HappyBird.ipa is unsigned, so install it with a sideloading tool such as AltStore or Sideloadly."

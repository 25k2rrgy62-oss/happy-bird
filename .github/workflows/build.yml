name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the game file
        run: |
          ls -la
          if [ ! -f index.html ]; then
            f=$(ls *.html 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp "$f" index.html; echo "Using $f"
            else echo "::error::No .html file found. Upload index.html to the repository first."; exit 1; fi
          fi

      - name: Create the iOS project
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/ios@6.2.0
          mkdir -p www
          cp index.html www/index.html
          npx cap init "Happy Bird" com.happybird.game --web-dir www
          npx cap add ios
          npx cap sync ios
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $PLIST || /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PLIST

      - name: Build the app (unsigned)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr HappyBird.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HappyBird-ipa
          path: HappyBird.ipa


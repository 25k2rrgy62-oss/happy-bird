name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Android.html', '*.png', '*.PNG', '.github/workflows/Android.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Find the game file and images
        run: |
          if [ -f Android.html ]; then cp Android.html game.html; echo "Using Android.html"
          elif [ -f index.html ]; then cp index.html game.html; echo "Android.html not found, using index.html"
          else echo "::error::No game file found. Upload Android.html to the repository first."; exit 1; fi
          for f in *.png *.PNG; do
            [ -f "$f" ] || continue
            w=$(identify -format '%w' "$f")
            if [ "$w" = "1024" ] && [ ! -f icon.png ]; then cp "$f" icon.png; echo "Icon: $f"; fi
            if [ "$w" = "2732" ] && [ ! -f splash.png ]; then cp "$f" splash.png; echo "Launch screen: $f"; fi
          done

      - name: Create the Android project
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          mkdir -p www
          cp game.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.happybird.game",
            "appName": "Happy Bird",
            "webDir": "www",
            "backgroundColor": "#16222e",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android
          RES=android/app/src/main/res
          # Portrait only, full screen without the status bar
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar"\(.*\)>#<style name="AppTheme.NoActionBar"\1>\n        <item name="android:windowFullscreen">true</item>#' $RES/values/styles.xml
          # App icon
          if [ -f icon.png ]; then
            rm -rf $RES/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir=$RES/mipmap-${d%%:*}; size=${d##*:}
              convert icon.png -filter point -resize ${size}x${size} $dir/ic_launcher.png
              cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            done
          fi
          # Launch screen
          if [ -f splash.png ]; then
            for f in $(find $RES -name 'splash.png'); do
              dims=$(identify -format '%wx%h' "$f")
              convert splash.png -filter point -resize "$dims^" -gravity center -extent "$dims" "$f"
            done
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HappyBird.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HappyBird-apk
          path: HappyBird.apk


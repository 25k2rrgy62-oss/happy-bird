<!doctype html>
<html lang="en" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html, body { margin: 0; background: #16222e; overscroll-behavior: none; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Happy Bird</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a 144x256 pixel canvas scaled up with nearest-neighbour into a centered portrait frame; score, menus and settings are pixel-styled DOM overlays sized from --u (frame width / 360). Scene colors are keyframed in the script. */
:root {
  color-scheme: dark;
  --page: #16222e;
  --ink: #2b1d14;
  --paper: #fff6dc;
  --paper-edge: #e8d29a;
  --sun: #ffd23f;
  --berry: #e8463a;
  --leaf: #6fbf3a;
  --muted: #7a6a55;
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "Pixelify Sans", "Courier New", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--paper);
  font-family: var(--body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  overscroll-behavior: none;
}

.stage { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; }

.frame {
  --u: 1;
  position: relative;
  width: 360px;
  height: 640px;
  overflow: hidden;
  background: var(--page);
  border: 3px solid var(--ink);
  box-shadow: 0 6px 0 #0b121a;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.frame:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#birdLayer { position: absolute; inset: 0; pointer-events: none; image-rendering: auto; }

/* hard pixel outline for text on the scene */
.outlined {
  color: var(--paper);
  text-shadow:
    calc(var(--u) * 3px) 0 0 var(--ink), calc(var(--u) * -3px) 0 0 var(--ink),
    0 calc(var(--u) * 3px) 0 var(--ink), 0 calc(var(--u) * -3px) 0 var(--ink),
    calc(var(--u) * 3px) calc(var(--u) * 3px) 0 var(--ink), calc(var(--u) * -3px) calc(var(--u) * 3px) 0 var(--ink),
    calc(var(--u) * 3px) calc(var(--u) * -3px) 0 var(--ink), calc(var(--u) * -3px) calc(var(--u) * -3px) 0 var(--ink),
    0 calc(var(--u) * 7px) 0 var(--ink);
}

.score {
  position: absolute;
  top: calc(var(--u) * 44px);
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--display);
  font-size: calc(var(--u) * 34px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.score.bump { animation: bump 0.16s steps(2); }
@keyframes bump { 50% { transform: translateY(calc(var(--u) * -5px)); } }

.chip {
  position: absolute;
  top: calc(var(--u) * 12px);
  z-index: 3;
  font: 600 14px/1 var(--body);
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--ink);
  box-shadow: 0 3px 0 var(--ink);
  padding: 6px 10px;
  cursor: pointer;
}
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.mute { right: calc(var(--u) * 12px); }
.settings-btn { left: calc(var(--u) * 12px); }
.chip:focus-visible, .btn:focus-visible, .opt:focus-visible, .sw:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.ready {
  position: absolute;
  top: calc(var(--u) * 92px);
  left: 0;
  right: 0;
  padding-inline: calc(var(--u) * 24px);
  text-align: center;
  pointer-events: none;
}
.ready h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: calc(var(--u) * 30px);
  line-height: 1.25;
  color: var(--sun);
}
.ready h1.outlined { color: var(--sun); }
.card {
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
  box-shadow: inset 0 -4px 0 var(--paper-edge), 0 4px 0 var(--ink);
}
.ready .card {
  width: fit-content;
  max-width: 100%;
  margin: calc(var(--u) * 150px) auto 0;
  padding: 8px 12px;
  font-size: max(14px, calc(var(--u) * 16px));
  line-height: 1.35;
  text-wrap: balance;
}
.ready .best-line {
  margin: 10px auto 0;
  font-family: var(--display);
  font-size: max(10px, calc(var(--u) * 11px));
  letter-spacing: 0.06em;
}

.over {
  position: absolute;
  left: 50%;
  top: 44%;
  transform: translate(-50%, -50%);
  width: calc(var(--u) * 280px);
  text-align: center;
  z-index: 2;
}
.over h2 {
  margin: 0 0 calc(var(--u) * 18px);
  font-family: var(--display);
  font-weight: 400;
  font-size: calc(var(--u) * 26px);
  line-height: 1.2;
  color: var(--berry);
}
.over .card { padding: calc(var(--u) * 16px); animation: drop 0.25s steps(5); }
@keyframes drop { from { transform: translateY(calc(var(--u) * 60px)); } to { transform: none; } }
.over dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0; }
.over dt { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.over dd { margin: 6px 0 0; font-family: var(--display); font-size: calc(var(--u) * 24px); line-height: 1; font-variant-numeric: tabular-nums; }
.badge {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 8px;
  background: var(--sun);
  color: var(--ink);
  border: 2px solid var(--ink);
  font: 600 13px/1 var(--body);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.btn {
  display: block;
  width: 100%;
  margin-top: calc(var(--u) * 16px);
  padding: 12px 14px;
  background: var(--leaf);
  color: var(--ink);
  border: 3px solid var(--ink);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 4px 0 var(--ink);
  font: 400 max(12px, calc(var(--u) * 14px))/1 var(--display);
  cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 1px 0 var(--ink); }
.keyhint { margin: 10px 0 0; font-size: 13px; color: var(--paper); }

.panel {
  position: absolute;
  left: calc(var(--u) * 14px);
  right: calc(var(--u) * 14px);
  bottom: calc(var(--u) * 14px);
  max-height: calc(100% - var(--u) * 150px);
  overflow-y: auto;
  padding: calc(var(--u) * 16px);
  cursor: default;
  z-index: 4;
}
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: max(13px, calc(var(--u) * 16px)); line-height: 1.2; }
.group { margin-top: 14px; }
.group h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.opts, .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.opt {
  font: 600 14px/1 var(--body);
  padding: 7px 10px;
  border: 2px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}
.opt[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.sw { width: 32px; height: 32px; padding: 0; border: 2px solid var(--ink); cursor: pointer; }
.sw[aria-checked="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
.note { margin: 8px 0 0; font-size: 14px; color: var(--muted); min-height: 1.3em; }

.shop-btn { left: calc(var(--u) * 12px); top: calc(var(--u) * 12px + 36px); }
.wallet {
  position: absolute;
  top: calc(var(--u) * 12px + 38px);
  right: calc(var(--u) * 12px);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 6px;
  font: 400 max(10px, calc(var(--u) * 12px))/1 var(--display);
  color: var(--paper);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 3px 0 var(--ink);
  pointer-events: none;
}
.wallet i { width: 12px; height: 12px; background: var(--sun); border: 2px solid var(--ink); border-radius: 50%; box-shadow: inset -2px -2px 0 #d8960f; }
.run-coins { margin: 12px 0 0; font-size: 15px; font-weight: 600; }
.btn.alt { background: var(--sun); }
.btn.ghost { background: var(--paper); }
.over .btn { margin-top: 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.opt:disabled, .sw:disabled { opacity: 0.32; cursor: not-allowed; }
.hint {
  position: absolute;
  left: 50%;
  top: 64%;
  transform: translateX(-50%);
  margin: 0;
  padding: 8px 12px;
  font-size: 16px;
  white-space: nowrap;
  pointer-events: none;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel-head .count { font: 400 11px/1 var(--display); }
.shop-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 2px dashed var(--paper-edge); }
.shop-row .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
.sw-mini { width: 22px; height: 22px; border: 2px solid var(--ink); flex: none; }
.buy {
  font: 600 13px/1 var(--body);
  padding: 7px 10px;
  min-width: 78px;
  border: 2px solid var(--ink);
  background: var(--sun);
  color: var(--ink);
  cursor: pointer;
}
.buy:disabled { background: var(--paper); opacity: 0.6; cursor: default; }
.buy:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* Installed app: edge to edge, HUD below the notch */
.app body { padding: 0; }
.app .frame { border: 0; box-shadow: none; }
.app .score { top: calc(env(safe-area-inset-top, 0px) + var(--u) * 26px); }
.app .chip { top: calc(env(safe-area-inset-top, 0px) + 6px); }
.app .shop-btn { top: calc(env(safe-area-inset-top, 0px) + 42px); }
.app .wallet { top: calc(env(safe-area-inset-top, 0px) + 46px); }
.app .ready { top: calc(env(safe-area-inset-top, 0px) + var(--u) * 80px); }
.app .panel {
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--u) * 14px);
  max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 110px);
}

@media (prefers-reduced-motion: reduce) {
  .score.bump, .over .card { animation: none; }
}
</style>

<main id="stage" class="stage">
  <div id="frame" class="frame" role="group" aria-label="Happy Bird. Tap, click or press Space to flap." tabindex="0">
    <canvas id="scene" width="144" height="256" aria-hidden="true"></canvas>
    <canvas id="birdLayer" width="144" height="256" aria-hidden="true"></canvas>
    <div id="score" class="score outlined" hidden>0</div>
    <button id="settingsBtn" class="chip settings-btn" type="button" aria-expanded="false">Settings</button>
    <button id="mute" class="chip mute" type="button" aria-pressed="false">Sound on</button>
    <button id="shopBtn" class="chip shop-btn" type="button" aria-expanded="false">Shop</button>
    <div class="wallet" aria-label="Coins"><i></i><span id="walletN">0</span></div>
    <p id="resumeHint" class="card hint" hidden>Tap to keep flying</p>

    <section id="ready" class="ready">
      <h1 class="outlined">HAPPY<br>BIRD</h1>
      <p class="card">Tap, click or press Space to flap. Each pipe earns a coin. Floating coins are a bonus.</p>
      <p id="bestReadyWrap" class="best-line outlined" hidden>BEST <span id="bestReady">0</span></p>
    </section>

    <section id="over" class="over" role="status" hidden>
      <h2 class="outlined">GAME OVER</h2>
      <div class="card">
        <dl>
          <div><dt>Score</dt><dd id="scoreEnd">0</dd></div>
          <div><dt>Best</dt><dd id="bestEnd">0</dd></div>
        </dl>
        <span id="newBest" class="badge" hidden>New best</span>
        <p id="runCoins" class="run-coins"></p>
      </div>
      <button id="revive" class="btn alt" type="button">REVIVE · 10</button>
      <button id="again" class="btn" type="button">PLAY AGAIN</button>
      <button id="overShop" class="btn ghost" type="button">SHOP</button>
      <button id="overBack" class="btn ghost" type="button">BACK</button>
    </section>

    <section id="settings" class="panel card" role="dialog" aria-label="Settings" hidden>
      <h2>SETTINGS</h2>
      <div class="group">
        <h3 id="bgLabel">Time of day</h3>
        <div id="bgOpts" class="opts" role="radiogroup" aria-labelledby="bgLabel"></div>
        <p id="bgNote" class="note"></p>
      </div>
      <div class="group">
        <h3 id="seasonLabel">Season</h3>
        <div id="seasonOpts" class="opts" role="radiogroup" aria-labelledby="seasonLabel"></div>
        <p id="seasonNote" class="note"></p>
      </div>
      <div class="group">
        <h3 id="birdLabel">Bird color</h3>
        <div id="birdOpts" class="swatches" role="radiogroup" aria-labelledby="birdLabel"></div>
        <p id="birdNote" class="note"></p>
      </div>
      <button id="settingsDone" class="btn" type="button">DONE</button>
    </section>

    <section id="shop" class="panel card" role="dialog" aria-label="Shop" hidden>
      <div class="panel-head"><h2>SHOP</h2><span class="count">COINS <b id="shopCoins">0</b></span></div>
      <div class="group"><h3>Seasons</h3><div id="shopSeasons"></div></div>
      <div class="group"><h3>Bird colors</h3><div id="shopBirds"></div></div>
      <button id="shopDone" class="btn" type="button">DONE</button>
    </section>
  </div>
</main>

<script>
(() => {
  'use strict';

  // Play field in canvas pixels (144 x 256, upscaled with nearest-neighbour)
  const W = 144, GROUND = 38, H_MIN = 256, H_MAX = 340;
  let H = 256, SKY_H = H - GROUND;
  const GRAV = 780, FLAP = -200, MAX_FALL = 310;
  const GAP_START = 80, GAP_MIN = 54, GAP_STEP = 1, COLW = 22, CAP_H = 6, CAP_X = 1, SPACING = 124, NODE = 14, BONUS_VALUE = 2, SPECIAL_VALUE = 5, SPECIAL_CHANCE = 0.18;
  const BIRD_X = 40, BIRD_Y_MENU = 52;
  let BIRD_Y = 112;
  const HIT_R = 4.5, BIRD_SCALE = 0.85;
  const BASE_SPEED = 86, SPEED_RAMP = 0.7, RAMP_CAP = 60;
  const CYCLE_SECONDS = 80;
  let HORIZON = SKY_H - 56;
  const ARC = 112;
  const STORE_KEY = 'happy-bird-best';
  const SET_KEY = 'happy-bird-settings';

  const $ = id => document.getElementById(id);
  const stage = $('stage'), frame = $('frame'), canvas = $('scene'), ctx = canvas.getContext('2d');
  const scoreEl = $('score'), readyEl = $('ready'), overEl = $('over');
  const muteBtn = $('mute'), againBtn = $('again'), settingsBtn = $('settingsBtn');
  const settingsEl = $('settings'), settingsDone = $('settingsDone');
  const bgOptsEl = $('bgOpts'), bgNote = $('bgNote'), birdOptsEl = $('birdOpts'), birdNote = $('birdNote');
  const seasonOptsEl = $('seasonOpts'), seasonNote = $('seasonNote');
  const shopBtn = $('shopBtn'), shopEl = $('shop'), shopDone = $('shopDone'), shopCoins = $('shopCoins');
  const shopSeasons = $('shopSeasons'), shopBirds = $('shopBirds'), walletN = $('walletN');
  const reviveBtn = $('revive'), overShop = $('overShop'), runCoinsEl = $('runCoins'), resumeHint = $('resumeHint');
  const bestReadyWrap = $('bestReadyWrap'), bestReady = $('bestReady');
  const scoreEnd = $('scoreEnd'), bestEnd = $('bestEnd'), newBestEl = $('newBest');
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  ctx.imageSmoothingEnabled = false;
  const APP = document.documentElement.classList.contains('app');
  const bCanvas = $('birdLayer'), bctx = bCanvas.getContext('2d');
  let BS = 1, shX = 0, shY = 0;

  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const hexRgb = h => { const v = parseInt(h.replace('#', ''), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; };
  const S = (c, a) => a === undefined
    ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'
    : 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  const INK = tok('--ink'), PAPER = hexRgb(tok('--paper'));

  // Time of day keyframes: sky(5) hill(3) bamboo(3: mid, light, dark) sun ground(4: grass, grass dark, sand, sand dot) cloud(2)
  const KEYS = [
    { t: 0.00, c: ['#7fb6e6', '#a3cdeb', '#cfe3ec', '#ffd9b0', '#ffe8c8', '#b9dca6', '#8fc77c', '#6aae58',
      '#78c044', '#bfe878', '#468f28', '#fff1b0', '#a6e266', '#7fc447', '#e6d496', '#d2bd76', '#ffffff', '#ffe3cf'], n: [0, 0.9] },
    { t: 0.22, c: ['#50bccb', '#54bfcd', '#5ac3d0', '#64c8d3', '#6ecdd7', '#c8eeb4', '#7fd36e', '#5bbb4c',
      '#6fbf3a', '#b6e86a', '#3f8a22', '#fff6c8', '#9be15d', '#73c13f', '#e2d38f', '#cfbd73', '#ffffff', '#d6eef4'], n: [0, 1] },
    { t: 0.50, c: ['#2c3170', '#5b4a9a', '#d4708e', '#ff9f72', '#ffc78e', '#8a6a9e', '#5e4f86', '#3f3a6a',
      '#5d9a3e', '#94c96a', '#33612a', '#ffd27a', '#7fae54', '#5f8f3f', '#c9a878', '#b08f62', '#ffc2a6', '#e08f8f'], n: [0.3, 0.8] },
    { t: 0.68, c: ['#0b1030', '#121a44', '#1b2856', '#243766', '#2f4676', '#25365e', '#1b2a4c', '#132039',
      '#2f5a3a', '#4f8a5c', '#1a3522', '#fff1b0', '#35603f', '#284b31', '#5e5a52', '#4e4a44', '#3a4a7a', '#2a375e'], n: [1, 0.5] },
    { t: 0.80, c: ['#0b1030', '#121a44', '#1b2856', '#243766', '#2f4676', '#25365e', '#1b2a4c', '#132039',
      '#2f5a3a', '#4f8a5c', '#1a3522', '#fff1b0', '#35603f', '#284b31', '#5e5a52', '#4e4a44', '#3a4a7a', '#2a375e'], n: [1, 0.5] },
    { t: 0.92, c: ['#3a3f7a', '#7a6aa8', '#e48fa0', '#ffb48a', '#ffd8a8', '#a08cb0', '#7a6c9a', '#56507a',
      '#64a446', '#9fd273', '#376a2c', '#ffe0a0', '#8cbc5a', '#6a9c44', '#d6b98a', '#bea06e', '#ffd0c0', '#e8a8b0'], n: [0.4, 0.8] }
  ].map(k => ({ t: k.t, c: k.c.map(hexRgb), n: k.n }));

  let P = null;
  const DAY = KEYS[1].c;
  function computePalette() {
    let i = 0;
    for (let j = 0; j < KEYS.length; j++) if (tod >= KEYS[j].t) i = j;
    const a = KEYS[i], b = KEYS[(i + 1) % KEYS.length];
    const t1 = i + 1 < KEYS.length ? b.t : 1;
    let f = (tod - a.t) / (t1 - a.t);
    f = f * f * (3 - 2 * f);
    const c = a.c.map((ca, idx) => {
      const cb = b.c[idx];
      return [Math.round(ca[0] + (cb[0] - ca[0]) * f), Math.round(ca[1] + (cb[1] - ca[1]) * f), Math.round(ca[2] + (cb[2] - ca[2]) * f)];
    });
    const n = a.n.map((v, idx) => v + (b.n[idx] - v) * f);
    const th = THEME.c;
    if (th) for (const idx in th) {
      const tc = th[idx], b0 = c[idx], d0 = DAY[idx];
      c[idx] = [0, 1, 2].map(k => Math.min(255, Math.round(tc[k] * (b0[k] + 8) / (d0[k] + 8))));
    }
    P = {
      sky: c.slice(0, 5), hill: c.slice(5, 8).map(x => S(x)), col: c.slice(8, 11).map(x => S(x)), sun: c[11],
      ground: c.slice(12, 16).map(x => S(x)), cloud: c.slice(16, 18).map(x => S(x)), star: n[0], cloudA: n[1]
    };
  }

  // Settings data
  const BG_OPTS = [['cycle', 'Cycle'], ['morning', 'Morning'], ['day', 'Day'], ['dusk', 'Dusk'], ['night', 'Night']];
  const BG_NOTES = {
    cycle: 'Moves from morning to night as you play.',
    morning: 'Always morning.', day: 'Always daytime.', dusk: 'Always dusk.', night: 'Always night.'
  };
  const FIXED_TOD = { morning: 0.05, day: 0.22, dusk: 0.52, night: 0.74 };
  const BIRDS = [
    { name: 'Sunny',  body: '#ffd23f', belly: '#fff3b0', accent: '#f08a24', dark: '#b85c12', beak: '#ff6a3d' },
    { name: 'Cherry', body: '#ef4b3f', belly: '#ffd2c2', accent: '#ffd23f', dark: '#c0901a', beak: '#ffb43b' },

    snow:    { rate: 22, make: () => ({ x: rand(0, W + 30), y: -3, vx: rand(-6, -2), vy: rand(14, 24), s: Math.random() < 0.3 ? 2 : 1, c: '#ffffff' }) },
    petal:   { rate: 6, make: () => ({ x: rand(0, W + 30), y: -3, vx: rand(-9, -4), vy: rand(10, 16), s: 2, h: 1, c: pick(['#ffb0cc', '#ffd6e4']) }) },
    leaf:    { rate: 5, make: () => ({ x: rand(0, W + 30), y: -3, vx: rand(-10, -4), vy: rand(12, 20), s: 2, c: pick(['#e8742a', '#d8452a', '#f2b03a']) }) },
    heart:   { rate: 1.6, make: () => ({ x: rand(0, W), y: SKY_H - rand(0, 20), vx: 0, vy: rand(-12, -7), kind: 'heart', c: pick(['#ff6a9a', '#ff9ec0']) }) },
    bat:     { rate: 0.6, make: () => ({ x: W + 6, y: rand(16, 120), vx: rand(-40, -28), vy: 0, kind: 'bat', c: '#1a1020' }) },
    sparkle: { rate: 6, make: () => ({ x: rand(0, W + 30), y: -3, vx: rand(-4, -1), vy: rand(6, 10), s: 1, kind: 'spark', c: '#ffd23f' }) }
  };
  function updateParts(dt) {
    const fx = THEME.fx && FX[THEME.fx];
    if (fx && !reduce) {
      partAcc += dt * fx.rate;
      while (partAcc >= 1) {
        partAcc -= 1;
        if (parts.length < 90) { const p = fx.make(); p.ph = Math.random() * 6.28; parts.push(p); }
      }
    }
    const drift = curSpeed * 0.3;
    for (const p of parts) {
      p.ph += dt * 3;

      const bat = p.kind === 'bat';
      p.x += (p.vx - drift + (bat ? 0 : Math.sin(p.ph) * 6)) * dt;
      p.y += (p.vy + (bat ? Math.sin(p.ph * 2) * 10 : 0)) * dt;

  function drawParts() {
    for (const p of parts) {

        ctx.fillRect(x, y, 2, 1); ctx.fillRect(x + 3, y, 2, 1); ctx.fillRect(x, y + 1, 5, 1);
        ctx.fillRect(x + 1, y + 2, 3, 1); ctx.fillRect(x + 2, y + 3, 1, 1);
      } else if (p.kind === 'bat') {

      }
    }
  }
  function drawLanterns() {
    const s = Math.floor(scroll * 0.3);
    for (let i = 0; i < 5; i++) {
      const lx = mod(i * 36 + 6 - s, W + 36) - 18, len = 6 + (i % 2) * 6;
      rect(lx + 3, 0, 1, len, INK);
      rect(lx + 1, len, 5, 1, '#ffd23f'); rect(lx, len + 1, 7, 5, '#e8322a'); rect(lx + 1, len + 2, 1, 3, '#ff7a5a');
      rect(lx + 1, len + 6, 5, 1, '#ffd23f'); rect(lx + 3, len + 7, 1, 2, '#ffd23f');

  }
  function pumpkin(x, y) {

    rect(x + 2, y + 1, 1, 3, '#c85a10'); rect(x + 4, y + 1, 1, 3, '#c85a10');
    if (P.star > 0.4) { rect(x + 1, y + 1, 1, 1, '#ffe066'); rect(x + 4, y + 1, 1, 1, '#ffe066'); rect(x + 2, y + 3, 2, 1, '#ffe066'); }
  }

  // Update
  function update(dt) {
    t += dt;
    if (bgMode === 'cycle') tod = (tod + dt / CYCLE_SECONDS) % 1;
    updateParts(dt);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    bird.wing = Math.max(0, bird.wing - dt / 0.24);

    if (state === 'ready') {
      scroll += 24 * dt; curSpeed = 24;
      bird.y = (settingsOpen || shopOpen ? BIRD_Y_MENU : BIRD_Y) + Math.round(Math.sin(t * 5) * 3);
      bird.rot = 0;
      autoFlap += dt;
      if (autoFlap > 0.4) { autoFlap = 0; bird.wing = 1; }
      return;
    }

    if (state === 'revive') {
      curSpeed = 0;
      autoFlap += dt;
      if (autoFlap > 0.4) { autoFlap = 0; bird.wing = 1; }
      return;
    }

    if (state === 'playing') {
      const speed = BASE_SPEED + Math.min(score, RAMP_CAP) * SPEED_RAMP;
      scroll += speed * dt; curSpeed = speed;
      bird.vy = Math.min(MAX_FALL, bird.vy + GRAV * dt);
      bird.y += bird.vy * dt;
      bird.rot += (clamp(bird.vy / 240, -0.4, 1.4) - bird.rot) * Math.min(1, dt * 14);
      if (bird.y < 6) { bird.y = 6; if (bird.vy < 0) bird.vy = 0; }

      for (const c of cols) c.x -= speed * dt;
      while (cols.length && cols[0].x + COLW + CAP_X + 6 < 0) cols.shift();
      fillCols();
      for (const b of bonus) b.x -= speed * dt;
      bonus = bonus.filter(b => b.x > -10);
      for (const b of bonus) {
        const dx = b.x - BIRD_X, dy = b.y - bird.y;
        if (!b.taken && dx * dx + dy * dy < (HIT_R + 6) * (HIT_R + 6)) {
          b.taken = true; addCoins(b.special ? SPECIAL_VALUE : BONUS_VALUE); coinBurst(b.x, b.y, b.special);
          if (b.special) tone(1047, 2093, 0.25, 'triangle', 0.06, 0.1);
          tone(1568, 1568, 0.05, 'square', 0.04); tone(2093, 2093, 0.1, 'square', 0.04, 0.05);
        }
      }

      for (const c of cols) {
        if (!c.scored && c.x + COLW / 2 < BIRD_X) {
          c.scored = true; score++; addCoins(1);
          scoreEl.textContent = score;
          if (!reduce) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
          tone(988, 988, 0.06, 'square', 0.04);
          tone(1319, 1319, 0.12, 'square', 0.04, 0.06);
        }
      }
      if (bird.y + HIT_R >= SKY_H) { bird.y = SKY_H - HIT_R; die(); return; }
      for (const c of cols) { if (hitsColumn(c)) { die(); return; } }
      return;
    }

    bird.vy = Math.min(MAX_FALL, bird.vy + GRAV * dt);
    bird.y += bird.vy * dt;
    bird.rot += (1.5 - bird.rot) * Math.min(1, dt * 10);
    if (bird.y + HIT_R >= SKY_H) { bird.y = SKY_H - HIT_R; bird.vy = 0; }
    if (!panelShown && performance.now() - deadAt > 650) showPanel();
  }

  // Drawing helpers (always whole pixels)
  function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function disc(cx, cy, r, c) {
    ctx.fillStyle = c;
    cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -r; dy <= r; dy++) {
      const hw = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8));
      ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
    }
  }
  const STOPS = [0, 0.38, 0.58, 0.70, 1];
  function skyAt(f) {
    let i = 0;
    while (i < STOPS.length - 2 && f > STOPS[i + 1]) i++;
    const u = (f - STOPS[i]) / (STOPS[i + 1] - STOPS[i]);
    const a = P.sky[i], b = P.sky[i + 1];
    return S([0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * u)));
  }

  function drawSky() {
    for (let y = 0; y < SKY_H; y += 6) rect(0, y, W, 6, skyAt(y / SKY_H));
    if (P.star > 0.01) {
      ctx.fillStyle = S(PAPER);
      for (const s of stars) {
        ctx.globalAlpha = P.star * (reduce ? 0.7 : (Math.sin(t * 2 + s.p) > -0.2 ? 0.9 : 0.35));
        ctx.fillRect(s.x, s.y, 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawCelestials() {
    const us = tod / 0.58;
    if (us <= 1) {
      const sx = 16 + 112 * us, sy = HORIZON - Math.sin(us * Math.PI) * ARC;
      ctx.globalAlpha = 0.25; disc(sx, sy, 17, S(P.sun));
      ctx.globalAlpha = 0.4; disc(sx, sy, 14, S(P.sun));
      ctx.globalAlpha = 1; disc(sx, sy, 11, S(P.sun));
    }
    const v = mod(tod - 0.56, 1);
    if (v <= 0.5) {
      const w = v / 0.5, mx = 16 + 112 * w, my = HORIZON - Math.sin(w * Math.PI) * ARC * 0.9;
      ctx.globalAlpha = 0.4 + 0.6 * P.star;
      disc(mx, my, 9, '#eef1ff');
      rect(mx - 4, my - 3, 3, 2, '#c4cae6'); rect(mx + 2, my + 1, 3, 3, '#c4cae6'); rect(mx - 2, my + 5, 2, 1, '#c4cae6');
      ctx.globalAlpha = 1;
    }
  }

  function drawClouds() {
    if (P.cloudA < 0.02) return;
    ctx.globalAlpha = P.cloudA;
    const span = W + 70;
    for (const c of clouds) {
      const x = Math.round(mod(c.x - scroll * 0.08, span) - 35), y = c.y, s = c.s;
      const r1 = Math.round(7 * s), r2 = Math.round(5 * s), off = Math.round(8 * s);
      for (const pass of [[1, P.cloud[1]], [0, P.cloud[0]]]) {
        disc(x, y + pass[0], r1, pass[1]);
        disc(x - off, y + 2 + pass[0], r2, pass[1]);
        disc(x + off, y + 2 + pass[0], r2, pass[1]);
      }
      rect(x - off - r2, y + 2 + r2 - 1, off * 2 + r2 * 2 + 1, 2, P.cloud[1]);
    }
    ctx.globalAlpha = 1;
  }

  function layer(color, fn, par) {
    ctx.fillStyle = color;
    const s = Math.floor(scroll * par);
    for (let x = 0; x < W; x++) {
      const y = Math.round(fn(x + s));
      ctx.fillRect(x, y, 1, SKY_H - y);
    }
  }
  function drawHills() {
    layer(P.hill[0], u => SKY_H - 44 - Math.abs(Math.sin(u * 0.085)) * 11 - Math.abs(Math.sin(u * 0.2 + 1)) * 3, 0.1);
    layer(P.hill[1], u => SKY_H - 32 + Math.sin(u * 0.07) * 6 + Math.sin(u * 0.17 + 2.1) * 2, 0.25);

        const x = mod(i * 29 + 7 - s, W + 20) - 10, y = SKY_H - 4 - (i * 7) % 6, fc = i % 2 ? '#ff9ec8' : '#fff4a8';

      }

    }
  }

  function shade(x, y, w, h) {

  // Coins, themed by season

    lunar: { g: ['..kkkkk..', '.kyyyyyk.', 'kyyyyyyyk', 'kyykkkyyk', 'kyyk.kyyk', 'kyykkkyyk', 'kyyyyyydk', '.kdddddk.', '..kkkkk..'],
      m: { y: '#ffcf3a', d: '#d8960f' }, spin: true, burst: '#ffd23f' },
    pumpkin: { g: ['....g....', '..kkgkk..', '.koooook.', 'koooooook', 'koyoooyok', 'koooooook', 'kooyyyook', '.koooook.', '..kkkkk..'],
      m: { g: '#3a7a2a', o: '#ee7a1c', y: '#ffe066' }, burst: '#ff9a2a' },
    ornament: { g: ['....k....', '...kgk...', '..kgggk..', '.krrrrrk.', 'krWWrrrrk', 'krWrrrrrk', 'krrrrrrdk', '.krrrrdk.', '..kkkkk..'],
      m: { g: '#ffd23f', r: '#e8322a', W: '#ffffff', d: '#a8201a' }, burst: '#ffffff' },
    heart: { g: ['.kkk.kkk.', 'kpppkpppk', 'kpWpppppk', 'kpWpppppk', 'kpppppppk', '.kpppppk.', '..kpppk..', '...kpk...', '....k....'],
      m: { p: '#ff5a8a', W: '#ffffff' }, burst: '#ff9ec0' },
    flower: { g: ['..kkkkk..', '.kpppppk.', 'kppppppdk', 'kpppyppdk', 'kppyyypdk', 'kpppyppdk', 'kppppppdk', '.kdddddk.', '..kkkkk..'],

  const COIN_FOR = { main: 'gold', spring: 'flower', valentine: 'heart', lunar: 'lunar', autumn: 'amber', halloween: 'pumpkin', christmas: 'ornament' };
  const coinCache = {};
  function coinSprite(key) {
    if (coinCache[key]) return coinCache[key];

  function drawCoin(c) {
    const key = COIN_FOR[themeKey] || 'gold', art = COIN_ART[key], spr = coinSprite(key);
    const cx = Math.round(c.x), bob = Math.round(Math.sin(t * 4 + c.y) * 1.2);

        rect(cx + Math.round(Math.cos(a) * 10) - 1, y + 4 + Math.round(Math.sin(a) * 10), 3, 1, 'rgba(255,255,255,0.5)');

      const a = i / n * Math.PI * 2, sp = big && i % 2 ? 60 : 40;

      rect(px, py, 1, th, P.col[1]);

  function drawColumn(c) {

    const tEnd = top - CAP_H, bStart = bot + CAP_H;
    if (tEnd > 0) shade(x, 0, COLW, tEnd);
    shade(x, bStart, COLW, SKY_H - bStart);

      const cx = x - CAP_X, cw = COLW + CAP_X * 2;

      rect(cx + 2, cy + 1, 3, CAP_H - 2, P.col[1]);
      rect(cx + cw - 5, cy + 1, 3, CAP_H - 2, P.col[2]);
      rect(cx + 1, cy + 1, cw - 2, 1, P.col[1]);
      rect(cx + 1, cy + CAP_H - 2, cw - 2, 1, P.col[2]);
    }
    const ccx = x - CAP_X, ccw = COLW + CAP_X * 2;
    if (THEME.deco === 'xmas') {
      rect(ccx - 1, bot - 2, ccw + 2, 2, '#ffffff'); rect(ccx + 3, bot, 2, 1, '#ffffff'); rect(ccx + ccw - 7, bot, 1, 2, '#ffffff');
      const LC = ['#ff4a4a', '#ffd23f', '#4ad06a', '#4aa0ff'];
      for (const cy of [tEnd, bot]) for (let i = 0, lx = ccx + 2; lx < ccx + ccw - 2; lx += 3, i++) {
        if ((i + Math.floor(t * 3)) % 3 !== 0) rect(lx, cy + Math.floor(CAP_H / 2) - 1, 1, 1, LC[i % 4]);
      }
    }
    if (THEME.deco === 'lanterns') {
      for (const cy of [tEnd, bot]) rect(ccx + 1, cy + Math.floor(CAP_H / 2) - 1, ccw - 2, 1, '#ffd23f');
    }
  }

  function drawGround() {
    const gy = SKY_H, sc = Math.floor(scroll);
    rect(0, gy, W, 1, INK);
    for (let yy = 0; yy < 6; yy++) {
      for (let x = 0; x < W; x++) {
        ctx.fillStyle = mod(x + sc + yy, 10) < 5 ? P.ground[0] : P.ground[1];
        ctx.fillRect(x, gy + 1 + yy, 1, 1);
      }
    }
    rect(0, gy + 7, W, 1, P.ground[1]);
    rect(0, gy + 8, W, GROUND - 8, P.ground[2]);
    ctx.fillStyle = P.ground[3];
    for (const d of sandDots) ctx.fillRect(mod(d.x - sc, W), gy + d.y, 2, 1);
  }

  function drawBird() {
    const wk = bird.wing > 0.55 ? 'down' : bird.wing > 0.15 ? 'up' : 'mid';
    const spr = sprite(birdIdx < 0 ? 0 : birdIdx, state === 'dead' ? 'mid' : wk);
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.clearRect(0, 0, bCanvas.width, bCanvas.height);
    bctx.imageSmoothingEnabled = false;
    bctx.translate((BIRD_X + shX) * BS, (Math.round(bird.y) + shY) * BS);
    bctx.rotate(bird.rot);
    const k = BS * BIRD_SCALE;
    bctx.drawImage(spr, -13 * k, -10 * k, spr.width * k, spr.height * k);
  }

  function draw() {
    computePalette();
    ctx.save();
    shX = 0; shY = 0;
    if (shake > 0 && !reduce) {
      const m = shake > 0.15 ? 2 : 1;
      shX = Math.round((Math.random() - 0.5) * 2 * m); shY = Math.round((Math.random() - 0.5) * 2 * m);
      ctx.translate(shX, shY);
    }

    drawCelestials();
    drawClouds();
    if (THEME.deco === 'lanterns') drawLanterns();
    drawHills();
    for (const c of cols) drawColumn(c);
    for (const b of bonus) if (!b.taken) drawCoin(b);
    drawGround();
    drawParts();
    drawBird();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = S(PAPER, Math.min(1, flash) * 0.8); ctx.fillRect(0, 0, W, H); }
  }

  // Sizing: whole-number scale when it costs little space, so pixels stay even
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    // Taller screens get a taller play field instead of empty bars
    const nh = clamp(Math.round(W * h / w), H_MIN, H_MAX);
    if (nh !== H) {
      const dy = nh - H;
      H = nh; SKY_H = H - GROUND; HORIZON = SKY_H - 56; BIRD_Y = Math.round(SKY_H * 0.51);
      canvas.height = H; ctx.imageSmoothingEnabled = false;
      for (const c of cols) c.gy += Math.round(dy / 2);
      for (const b of bonus) b.y += Math.round(dy / 2);
      if (state !== 'playing') bird.y += Math.round(dy / 2);
      genStars();
    }
    let fw, fh;
    if (APP) {
      fw = w; fh = h;
    } else {
      let s = Math.min(w / W, h / H);
      const si = Math.floor(s);
      if (si >= 2 && si / s > 0.85) s = si;
      fw = Math.floor(W * s); fh = Math.floor(H * s);
    }
    frame.style.width = fw + 'px';
    frame.style.height = fh + 'px';
    frame.style.setProperty('--u', (fw / 360).toFixed(4));
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    bCanvas.width = Math.round(fw * dpr);
    bCanvas.height = Math.round(fh * dpr);
    BS = bCanvas.width / W;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);

  let last = 0;
  function loop(ts) {
    const dt = last ? Math.min(0.033, (ts - last) / 1000) : 0.016;
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => { last = 0; });

  updateWallet();
  applySeason();
  applyBg();
  syncSettingsUI();
  reset();
  resize();
  draw();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
